<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏏 Cricket Live Center & News - સમયચક્ર</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans Gujarati',sans-serif;background:#060913;color:#fff;min-height:100vh;display:flex;flex-direction:column}
  header{background:rgba(10,15,28,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.08);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
  .logo{font-size:21px;font-weight:800;color:#10b981;text-decoration:none;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;background:#ef4444;border-radius:50%;display:inline-block;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  .back{background:#1e293b;color:#fff;text-decoration:none;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700}
  .layout{max-width:1220px;margin:22px auto;padding:0 16px;width:100%;flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
  @media(max-width:850px){.layout{grid-template-columns:1fr}}
  .panel{background:rgba(17,24,39,0.88);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,0.4)}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:10px}
  .head h2{font-size:18px;color:#38bdf8;font-weight:800}
  .c-story{display:flex;gap:12px;align-items:center;background:#0f172a;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:10px;margin-bottom:12px;text-decoration:none;color:#fff;transition:0.3s}
  .c-story:hover{transform:translateY(-4px) scale(1.01);border-color:#10b981;box-shadow:0 10px 24px rgba(16,185,129,0.25)}
  .c-thumb{width:108px;height:78px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#1e293b;position:relative}
  .c-thumb img{width:100%;height:100%;object-fit:cover;transition:0.4s}
  .c-story:hover .c-thumb img{transform:scale(1.12)}
  .p-icon{position:absolute;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;font-size:18px}
  .c-info h3{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:4px}
  .c-story:hover .c-info h3{color:#6ee7b7}
  .c-info p{font-size:12px;color:#94a3b8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c-meta{font-size:11px;color:#38bdf8;font-weight:700;margin-top:5px;display:inline-block}
  .badge{background:#ef4444;color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
  .mbox{background:linear-gradient(135deg,#064e3b,#0f172a);border:1px solid #10b981;border-radius:12px;padding:14px;margin-bottom:12px}
  .teams{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
  .team{flex:1}
  .team h3{font-size:15px;font-weight:800}
  .score{font-size:19px;font-weight:800;color:#fde047;margin-top:2px}
  .stxt{background:rgba(0,0,0,0.4);padding:6px 10px;border-radius:8px;font-size:12px;color:#6ee7b7;font-weight:600;margin-top:6px}
  .ibox{background:#0f172a;border:1px solid #1e293b;padding:12px;border-radius:10px;margin-top:10px;font-size:13px;color:#cbd5e1}
  footer{background:#05080f;border-top:1px solid #1f2937;text-align:center;padding:18px;color:#64748b;font-size:13px;margin-top:40px}
  footer a{color:#94a3b8;text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<header>
  <a href="index.html" class="logo"><span class="dot"></span> 🏏 Cricket Live Center</a>
  <a href="index.html" class="back">← સમયચક્ર હોમ</a>
</header>

<div class="layout">
  <div class="panel">
    <div class="head">
      <h2>📰 ક્રિકેટ ન્યૂઝ સ્ટોરીઝ</h2>
      <span style="font-size:12px;color:#94a3b8">ક્લિક કરીને ચલાવો ▶</span>
    </div>
    <div id="cList"><p style="color:#94a3b8;text-align:center;padding:25px">લોડ થઈ રહ્યું છે...</p></div>
  </div>

  <div>
    <div class="panel" style="margin-bottom:18px">
      <div class="head">
        <span class="badge"><span class="dot" style="background:#fff"></span> LIVE SCOREBOARD</span>
        <button onclick="loadScores()" style="background:#10b981;color:#fff;border:0;padding:5px 12px;border-radius:15px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer">🔄 રિફ્રેશ</button>
      </div>
      <div id="liveBox"><div class="mbox" style="text-align:center"><p style="color:#6ee7b7;font-size:14px">⏳ સ્કોર લોડ થઈ રહ્યા છે...</p></div></div>
    </div>

    <div class="panel">
      <h2 id="mTitle" style="font-size:16px;color:#fde047;margin-bottom:6px">👥 મેચ વિશ્લેષણ</h2>
      <div class="ibox"><b id="tAName" style="color:#60a5fa"></b><p id="tAPlayers" style="margin-top:4px;font-size:12px"></p></div>
      <div class="ibox"><b id="pReport" style="color:#38bdf8"></b></div>
    </div>
  </div>
</div>

<footer>
  <a href="about.html">About Us</a> • <a href="privacy.html">Privacy Policy</a> • <a href="disclaimer.html">Disclaimer</a> • <a href="contact.html">Contact</a>
  <br><br>© 2026 સમયચક્ર (SamayChakra). All Rights Reserved.
</footer>

<script>
function fmtDate(s){
  if(s && s.pubDate) return s.pubDate;
  if(s && s.id && s.id.indexOf('st-') === 0){
    const ts = Number(s.id.replace('st-',''));
    if(!isNaN(ts) && ts > 1000000){
      const d = new Date(ts);
      return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) + ' • ' + d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
    }
  }
  return '28 Nov 2026';
}

fetch("stories.json?t=" + Date.now()).then(function(r){ return r.json(); }).then(function(all){
  const box = document.getElementById('cList');
  if(!Array.isArray(all)){ box.innerHTML = ''; return; }
  const list = all.filter(function(x){ return x.category === 'cricket'; });
  if(!list.length){ box.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:20px">હજુ કોઈ ક્રિકેટ ન્યૂઝ સ્ટોરી નથી.</p>'; return; }
  box.innerHTML = list.map(function(s){
    return '<a href="story.html?id=' + s.id + '" class="c-story"><div class="c-thumb"><img src="' + (s.image||'Adalaj.jpg') + '" onerror="this.src=\'Adalaj.jpg\'"><div class="p-icon">▶</div></div><div class="c-info"><h3>' + s.title + '</h3><p>' + (s.desc||'') + '</p><span class="c-meta">📅 ' + fmtDate(s) + ' • ⏱ ' + (s.readTime||'3 મિનિટ') + '</span></div></a>';
  }).join('');
}).catch(function(){});

fetch("cricket-data.json?t=" + Date.now()).then(function(r){ return r.json(); }).then(function(d){
  document.getElementById('mTitle').innerText = "👥 " + (d.matchTitle || "મેચ વિશ્લેષણ");
  document.getElementById('tAName').innerText = d.teamAName || "";
  document.getElementById('tAPlayers').innerText = d.teamAPlayers || "";
  document.getElementById('pReport').innerText = "🏟️ પિચ રિપોર્ટ: " + (d.pitchReport || "");
}).catch(function(){});

const W_URL = "https://wispy-term-3185cricket-live." + "allthebestgujarat.workers.dev/";

function loadScores(){
  const box = document.getElementById('liveBox');
  fetch(W_URL).then(function(r){ return r.json(); }).then(function(data){
    if(data && data.status === "success" && Array.isArray(data.data) && data.data.length){
      const live = data.data.filter(function(m){ return m.ms === "live"; });
      const rest = data.data.filter(function(m){ return m.ms !== "live"; });
      const show = live.concat(rest).slice(0, 5);
      box.innerHTML = show.map(function(m){
        const isL = m.ms === "live";
        const b = isL ? '<span style="background:#ef4444;color:#fff;padding:2px 6px;border-radius:6px;font-size:10px;margin-right:5px">● LIVE</span>' : '';
        return '<div class="mbox" style="' + (isL?'border-color:#ef4444':'') + '"><small style="color:#a7f3d0">' + b + (m.matchType||'MATCH').toUpperCase() + ' • ' + (m.series||'') + '</small><div class="teams"><div class="team"><h3>' + (m.t1||'Team A') + '</h3><div class="score">' + (m.t1s||'Yet to bat') + '</div></div><div style="font-weight:800;color:#ef4444;font-size:13px">VS</div><div class="team" style="text-align:right"><h3>' + (m.t2||'Team B') + '</h3><div class="score">' + (m.t2s||'Yet to bat') + '</div></div></div><div class="stxt">🔥 ' + (m.status||'') + '</div></div>';
      }).join('');
    } else {
      box.innerHTML = '<div class="mbox" style="text-align:center"><p style="color:#fde047;font-size:13px">🏏 હાલમાં કોઈ લાઈવ ફીડ ઉપલબ્ધ નથી.</p></div>';
    }
  }).catch(function(){
    box.innerHTML = '<div class="mbox" style="text-align:center"><p style="color:#fde047;font-size:13px">🏏 લાઈવ સ્કોર લોડ થઈ શક્યો નથી.</p></div>';
  });
}
loadScores();
</script>
</body>
</html>
