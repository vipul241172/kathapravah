<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - સમયચક્ર</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans Gujarati',sans-serif;background:#090d16;color:#fff;padding-bottom:50px}
  #login{position:fixed;inset:0;background:#090d16;display:flex;align-items:center;justify-content:center;z-index:99}
  .lbox{background:#111827;border:1px solid #1f2937;padding:28px;border-radius:16px;width:340px;text-align:center}
  header{background:#111827;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2937}
  .wrap{max-width:850px;margin:24px auto;padding:0 16px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:20px;margin-bottom:24px}
  label{display:block;font-size:13px;color:#94a3b8;margin:10px 0 5px}
  input,select,textarea{width:100%;background:#1e293b;border:1px solid #334155;color:#fff;padding:10px;border-radius:8px;font-family:inherit;font-size:14px}
  .step{background:#0f172a;border:1px dashed #334155;padding:12px;border-radius:12px;margin-top:12px}
  .row{display:flex;gap:12px;align-items:center;margin-top:6px}
  .prev{width:110px;height:72px;object-fit:cover;border-radius:8px;background:#1e293b;border:1px solid #334155}
  .btn{border:0;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;font-size:13px;display:inline-block}
  .red{background:#ef4444;color:#fff} .dark{background:#1e293b;color:#fff} .green{background:#10b981;color:#fff;width:100%;margin-top:16px;font-size:15px;padding:14px}
  .blue{background:#3b82f6;color:#fff}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h2 style="color:#ef4444;margin-bottom:12px">સમયચક્ર Admin</h2>
    <input type="password" id="pw" placeholder="પાસવર્ડ નાખો" onkeypress="if(event.key==='Enter')chk()">
    <button type="button" class="btn red" style="width:100%;margin-top:12px" onclick="chk()">લોગિન કરો</button>
  </div>
</div>

<header>
  <b style="color:#ef4444;font-size:20px">⏳ સમયચક્ર Admin (Single Image Mode)</b>
  <a href="index.html" class="btn dark">🌐 વેબસાઈટ જુઓ</a>
</header>

<div class="wrap">
  <div class="card">
    <h3>✍️ નવી સ્ટોરી બનાવો</h3>
    <label>કેટેગરી</label>
    <select id="cat">
      <option value="news|સમાચાર">સમાચાર</option>
      <option value="horror|રહસ્યમય વાર્તાઓ">રહસ્યમય વાર્તાઓ</option>
      <option value="history|ઇતિહાસ">ઇતિહાસ</option>
      <option value="tech|ટેકનોલોજી">ટેકનોલોજી</option>
    </select>
    
    <label>વાર્તાનું શીર્ષક</label>
    <input type="text" id="ttl" placeholder="શીર્ષક લખો...">
    
    <label>ટૂંકું વર્ણન</label>
    <input type="text" id="dsc" placeholder="હોમપેજ માટે ૨ લાઈન...">

    <label style="color:#38bdf8;font-weight:700">🖼️ સ્ટોરીનો મુખ્ય ફોટો (આખી સ્ટોરીમાં આ એક જ ફોટો દેખાશે)</label>
    <div class="row" style="background:#0f172a;padding:12px;border-radius:10px;border:1px solid #334155">
      <input type="file" accept="image/*" onchange="upMainImg(this)">
      <input type="hidden" id="mainImg">
      <img id="mainPrev" class="prev" src="">
    </div>

    <div id="steps"></div>
    
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button type="button" class="btn dark" onclick="add(1)">+ ૧ પેરેગ્રાફ</button>
      <button type="button" class="btn dark" style="color:#38bdf8" onclick="add(10)">+ ૧૦ પેરેગ્રાફ</button>
    </div>
    <button type="button" class="btn green" onclick="gen()">🚀 સ્ટોરી તૈયાર કરો</button>
  </div>

  <div class="card" id="ob" style="display:none;border-color:#10b981">
    <h3 style="color:#10b981">✅ સ્ટોરી તૈયાર છે!</h3>
    
    <div style="background:#0f172a;padding:14px;border-radius:10px;margin-top:12px">
      <b style="color:#38bdf8">પગલું ૧:</b> સ્ટોરી ફાઈલ (<code id="fname"></code>) ડાઉનલોડ કરીને GitHub પર Upload કરો:<br><br>
      <button type="button" class="btn blue" onclick="dlFile()">⬇️ સ્ટોરી ફાઈલ ડાઉનલોડ કરો</button>
      <a href="https://github.com" target="_blank" class="btn dark">📤 GitHub પર Upload કરો →</a>
    </div>

    <div style="background:#0f172a;padding:14px;border-radius:10px;margin-top:12px">
      <b style="color:#fde047">પગલું ૨:</b> <code style="color:#fff">stories.json</code> માટે નીચેનો કોડ Copy કરીને પેસ્ટ કરો:<br>
      <textarea id="jo" rows="3" readonly style="font-size:12px;color:#38bdf8;margin-top:8px"></textarea><br><br>
      <button type="button" class="btn green" style="margin-top:0;width:auto;padding:10px 16px" onclick="cp()">📋 કોડ Copy કરો</button>
      <a href="https://github.com" target="_blank" class="btn red">🔗 stories.json ખોલો →</a>
    </div>
  </div>
</div>

<script>
function chk(){
  if(document.getElementById('pw').value.trim()==='Vipul@2026#'){
    document.getElementById('login').style.display='none';
  } else alert('ખોટો પાસવર્ડ!');
}

let n=0, ex=new Array(), storyFileBlob="", storyFileName="";

function upMainImg(inp){
  const f=inp.files.item(0); if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas'), s=Math.min(1,800/im.width);
      c.width=im.width*s; c.height=im.height*s;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const u=c.toDataURL('image/jpeg',0.72);
      document.getElementById('mainImg').value=u;
      document.getElementById('mainPrev').src=u;
    };
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function add(c){
  for(let k=0; k<(c||1); k++){
    n++;
    const d=document.createElement('div');
    d.className='step';
    d.innerHTML='<div style="display:flex;justify-content:space-between"><b style="color:#f87171;font-size:13px">પેરેગ્રાફ #'+n+'</b><button type="button" onclick="this.parentElement.parentElement.remove()" style="color:#f87171;background:none;border:0;cursor:pointer">કાઢો</button></div><textarea rows="2" class="txt" placeholder="ગુજરાતી લખાણ..." style="margin-top:6px"></textarea>';
    document.getElementById('steps').appendChild(d);
  }
}

fetch("stories.json?t="+Date.now()).then(r=>r.json()).then(a=>{ if(Array.isArray(a)) ex=a; }).catch(()=>{});

function gen(){
  const p=document.getElementById('cat').value.split('|'), t=document.getElementById('ttl').value.trim(), d=document.getElementById('dsc').value.trim();
  const singleImg = document.getElementById('mainImg').value || 'Adalaj.jpg';
  if(!t)return alert('શીર્ષક લખો!');
  
  const s=new Array();
  document.querySelectorAll('.step').forEach(el=>{
    const tx=el.querySelector('.txt').value.trim();
    if(tx) s.push({t:tx, i:singleImg, c:'#1e1b4b'});
  });
  if(!s.length)return alert('ઓછામાં ઓછો ૧ પેરેગ્રાફ લખો!');

  const newId = 'st-' + Date.now();
  storyFileName = newId + '.json';
  
  const fullObj = { id:newId, category:p.at(0), categoryName:p.at(1), title:t, desc:d||s.at(0).t.slice(0,80), image:singleImg, readTime:Math.max(2,Math.ceil(s.length/2))+' મિનિટ', s:s };
  storyFileBlob = JSON.stringify(fullObj);

  const lightEntry = { id:newId, category:p.at(0), categoryName:p.at(1), title:t, desc:d||s.at(0).t.slice(0,80), image:singleImg, readTime:Math.max(2,Math.ceil(s.length/2))+' મિનિટ' };
  const upArr = ex.slice();
  upArr.unshift(lightEntry);

  document.getElementById('fname').innerText = storyFileName;
  document.getElementById('jo').value = JSON.stringify(upArr);
  document.getElementById('ob').style.display = 'block';
  document.getElementById('ob').scrollIntoView({behavior:'smooth'});
}

function dlFile(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([storyFileBlob], {type: 'application/json'}));
  a.download = storyFileName;
  a.click();
}

function cp(){
  const o=document.getElementById('jo'); o.select(); navigator.clipboard.writeText(o.value);
  alert('કોડ Copy થઈ ગયો છે! હવે stories.json માં પેસ્ટ કરો.');
}

add(2);
</script>
</body>
</html>
