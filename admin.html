<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - કથાપ્રવાહ</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans Gujarati',sans-serif;background:#090d16;color:#fff;padding-bottom:50px}
  #login{position:fixed;inset:0;background:#090d16;display:flex;align-items:center;justify-content:center;z-index:99}
  .lbox{background:#111827;border:1px solid #1f2937;padding:28px;border-radius:16px;width:340px;text-align:center}
  header{background:#111827;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2937}
  .wrap{max-width:850px;margin:24px auto;padding:0 16px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:20px;margin-bottom:24px}
  label{display:block;font-size:13px;color:#94a3b8;margin:10px 0 5px}
  input,select,textarea{width:100%;background:#1e293b;border:1px solid #334155;color:#fff;padding:10px;border-radius:8px;font-family:inherit;font-size:14px}
  .step{background:#0f172a;border:1px dashed #334155;padding:14px;border-radius:12px;margin-top:14px}
  .row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .prev{width:75px;height:52px;object-fit:cover;border-radius:6px;background:#1e293b}
  .btn{border:0;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;font-size:13px}
  .red{background:#ef4444;color:#fff} .dark{background:#1e293b;color:#fff} .green{background:#10b981;color:#fff;width:100%;margin-top:16px;font-size:15px;padding:14px}
  .item{display:flex;justify-content:space-between;align-items:center;background:#1e293b;padding:12px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h2 style="color:#ef4444;margin-bottom:12px">કથાપ્રવાહ Admin</h2>
    <input type="password" id="pw" placeholder="પાસવર્ડ (admin123)" onkeypress="if(event.key==='Enter')chk()">
    <button type="button" class="btn red" style="width:100%;margin-top:12px" onclick="chk()">લોગિન કરો</button>
  </div>
</div>

<header>
  <b style="color:#ef4444;font-size:20px">કથાપ્રવાહ Admin</b>
  <a href="index.html" class="btn dark">🌐 વેબસાઈટ જુઓ</a>
</header>

<div class="wrap">
  <div class="card">
    <h3>✍️ નવી સ્ટોરી બનાવો</h3>
    <label>કેટેગરી</label>
    <select id="cat">
      <option value="news|સમાચાર">સમાચાર</option>
      <option value="horror|રહસ્યમય વાર્તાઓ">રહસ્યમય વાર્તાઓ</option>
      <option value="history|ઇતિહાસ">ઇતિહાસ</option>
      <option value="tech|ટેકનોલોજી">ટેકનોલોજી</option>
    </select>
    <label>વાર્તાનું શીર્ષક</label>
    <input type="text" id="ttl" placeholder="શીર્ષક લખો...">
    <label>ટૂંકું વર્ણન</label>
    <input type="text" id="dsc" placeholder="હોમપેજ માટે ૨ લાઈન...">
    
    <div id="steps"></div>
    
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button type="button" class="btn dark" onclick="add(1)">+ ૧ પેરેગ્રાફ ઉમેરો</button>
      <button type="button" class="btn dark" style="color:#38bdf8" onclick="add(10)">+ ૧૦ પેરેગ્રાફ એકસાથે ઉમેરો</button>
    </div>
    <button type="button" class="btn green" onclick="generateStory()">🚀 સ્ટોરી તૈયાર કરો (Copy & Save)</button>
  </div>

  <div class="card" id="outBox" style="display:none;border-color:#10b981">
    <h3 style="color:#10b981">✅ તમારી સ્ટોરી તૈયાર છે!</h3>
    <p style="font-size:13px;color:#cbd5e1;margin:8px 0">નીચેનો કોડ આપમેળે <b>Copy</b> થઈ ગયો છે. બસ <b>"GitHub પર સેવ કરો"</b> બટન દબાવીને <code>stories.json</code> માં પેસ્ટ કરી દો:</p>
    <textarea id="jsonOut" rows="4" readonly style="font-size:12px;color:#38bdf8"></textarea>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button type="button" class="btn dark" onclick="copyCode()">📋 ફરીથી Copy કરો</button>
      <a href="https://github.com" target="_blank" class="btn red">🔗 GitHub પર stories.json ખોલો →</a>
    </div>
  </div>

  <div class="card">
    <h3>📚 હાલની સ્ટોરીઝ</h3>
    <div id="list"></div>
  </div>
</div>

<script>
if(sessionStorage.getItem('ok')==='1') document.getElementById('login').style.display='none';
function chk(){
  if(document.getElementById('pw').value.trim()==='admin123'){
    sessionStorage.setItem('ok','1');
    document.getElementById('login').style.display='none';
  } else { alert('ખોટો પાસવર્ડ!'); }
}

let n = 0;
function add(count){
  const total = count || 1;
  for(let k=0; k<total; k++){
    n++;
    const d = document.createElement('div');
    d.className = 'step';
    d.innerHTML =
      '<div style="display:flex;justify-content:space-between">' +
        '<b style="color:#f87171;font-size:13px">પેરેગ્રાફ #' + n + '</b>' +
        '<button type="button" onclick="this.parentElement.parentElement.remove()" style="color:#f87171;background:none;border:0;cursor:pointer">કાઢો</button>' +
      '</div>' +
      '<textarea rows="2" class="txt" placeholder="ગુજરાતી લખાણ..." style="margin-top:6px"></textarea>' +
      '<div class="row">' +
        '<input type="file" accept="image/*" onchange="imgUp(this)">' +
        '<input type="hidden" class="imgv">' +
        '<img class="prev" src="">' +
      '</div>';
    document.getElementById('steps').appendChild(d);
  }
}

function imgUp(inp){
  const f = inp.files.item(0);
  if(!f) return;
  const r = new FileReader();
  r.onload = function(e){
    const im = new Image();
    im.onload = function(){
      const c = document.createElement('canvas');
      const s = Math.min(1, 650 / im.width);
      c.width = im.width * s;
      c.height = im.height * s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const u = c.toDataURL('image/jpeg', 0.6);
      const row = inp.closest('.row');
      row.querySelector('.imgv').value = u;
      row.querySelector('.prev').src = u;
    };
    im.src = e.target.result;
  };
  r.readAsDataURL(f);
}

let existingStories = new Array();
fetch("stories.json?t=" + Date.now()).then(function(r){ return r.json(); }).then(function(arr){
  if(Array.isArray(arr)) existingStories = arr;
  renderList();
}).catch(function(){ renderList(); });

function renderList(){
  const box = document.getElementById('list');
  if(!existingStories.length){
    box.innerHTML = '<p style="color:#64748b;font-size:13px">હજુ કોઈ સ્ટોરી નથી.</p>';
    return;
  }
  box.innerHTML = existingStories.map(function(x, idx){
    return '<div class="item"><div><b>' + x.title + '</b><br><small style="color:#94a3b8">' + x.categoryName + '</small></div>' +
    '<div><a href="story.html?id=' + x.id + '" class="btn dark">જુઓ</a> ' +
    '<button type="button" onclick="delStory(' + idx + ')" class="btn dark" style="color:#f87171">ડિલીટ</button></div></div>';
  }).join('');
}

function generateStory(){
  const parts = document.getElementById('cat').value.split('|');
  const t = document.getElementById('ttl').value.trim();
  const d = document.getElementById('dsc').value.trim();
  if(!t){ alert('શીર્ષક લખો!'); return; }

  const s = new Array();
  document.querySelectorAll('.step').forEach(function(el){
    const tx = el.querySelector('.txt').value.trim();
    const im = el.querySelector('.imgv').value || 'Adalaj.jpg';
    if(tx) s.push({ t: tx, i: im, c: '#1e1b4b' });
  });
  if(!s.length){ alert('ઓછામાં ઓછો ૧ પેરેગ્રાફ લખો!'); return; }

  const updated = existingStories.slice();
  updated.unshift({
    id: "st-" + Date.now(),
    category: parts.at(0),
    categoryName: parts.at(1),
    title: t,
    desc: d || s.at(0).t.slice(0, 80),
    image: s.at(0).i,
    readTime: Math.max(2, Math.ceil(s.length / 2)) + ' મિનિટ',
    s: s
  });

  showOutput(updated);
}

function delStory(idx){
  if(!confirm('આ સ્ટોરી ડિલીટ કરવા માટે નવો કોડ જનરેટ થશે, જેને stories.json માં પેસ્ટ કરવો પડશે. આગળ વધવું છે?')) return;
  const updated = existingStories.slice();
  updated.splice(idx, 1);
  showOutput(updated);
}

function showOutput(arr){
  const jsonStr = JSON.stringify(arr);
  const out = document.getElementById('jsonOut');
  out.value = jsonStr;
  document.getElementById('outBox').style.display = 'block';
  out.select();
  navigator.clipboard.writeText(jsonStr).catch(function(){});
  document.getElementById('outBox').scrollIntoView({ behavior: 'smooth' });
}

function copyCode(){
  const out = document.getElementById('jsonOut');
  out.select();
  navigator.clipboard.writeText(out.value);
  alert('કોડ કોપી થઈ ગયો છે! હવે GitHub પર stories.json માં પેસ્ટ કરો.');
}

add(2);
</script>
</body>
</html>
