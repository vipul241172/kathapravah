<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>સમયચક્ર - સ્ટોરી</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans Gujarati',sans-serif;background:#090d16;color:#fff}
  .bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s ease-in-out;z-index:1}
  .bg.active{opacity:1}
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:2}
  .top{position:fixed;top:0;left:0;right:0;background:rgba(10,15,28,.85);backdrop-filter:blur(6px);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;z-index:999}
  .top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;font-size:14px}
  main{position:relative;z-index:10;padding:80px 18px 140px}
  .sec{min-height:18vh;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .card{
    background:transparent;padding:12px 16px;max-width:650px;width:100%;
    font-size:20px;font-weight:600;line-height:1.85;color:#ffffff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.95), 0 0 18px rgba(0,0,0,0.9);
    transition: transform 0.3s, color 0.3s;
  }
  .card.speaking{color:#fde047;transform:scale(1.02)}
  .bar{position:fixed;bottom:16px;left:0;right:0;margin:auto;width:fit-content;background:rgba(15,23,42,.95);backdrop-filter:blur(8px);padding:8px 12px;border-radius:40px;display:flex;gap:6px;align-items:center;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.85);flex-wrap:wrap;justify-content:center}
  #pbtn{background:#ef4444;color:#fff;border:0;padding:7px 14px;border-radius:25px;font-weight:700;cursor:pointer;font-size:13px}
  #vbtn,#mbtn{background:#1e293b;color:#38bdf8;border:0;padding:7px 11px;border-radius:25px;font-weight:700;cursor:pointer;font-size:12px}
  #vbtn.on{background:#10b981;color:#fff}
  .sbtn{background:transparent;color:#cbd5e1;border:0;padding:5px 8px;border-radius:15px;cursor:pointer;font-size:11px}
  .sbtn.on{background:#475569;color:#fff}
</style>
</head>
<body>
<div class="top"><a href="index.html">← પાછા જાઓ</a><span id="cat" style="color:#f87171;font-weight:700"></span></div>
<div id="bgs"></div><div class="shade"></div>
<main id="box"><div class="sec"><div class="card" style="text-align:center">સ્ટોરી લોડ થઈ રહી છે...</div></div></main>

<div class="bar">
  <button id="pbtn" onclick="tog()">▶ Play</button>
  <button id="vbtn" onclick="togVoice()">🔇 Voice</button>
  <button id="mbtn" onclick="togMusic()">🔇 Music</button>
  <button class="sbtn on" onclick="spd(0.6,this)">Slow</button>
  <button class="sbtn" onclick="spd(1.2,this)">Med</button>
  <button class="sbtn" onclick="spd(2.2,this)">Fast</button>
</div>

<script>
const fallback = {
  cat: "ઇતિહાસ",
  title: "અડાલજની વાવ: પથ્થરોમાં કોતરાયેલી અમર પ્રેમ અને બલિદાનની ગાથા",
  pubDate: "25 Nov 2026",
  s: [
    {t:"ઈસવીસન ૧૪૯૮માં ગુજરાતના પાટણ નજીક દાંડાઈ દેશના રાજા વીરસિંહ વાઘેલા રાજ કરતા હતા. તેમની રાણી રૂડાબાઈ અત્યંત રૂપવાન અને પ્રજાવત્સલ હતા.",i:"Adalaj.jpg",c:"#1e1b4b"},
    {t:"તે સમયે રાજ્યમાં પાણીની ભારે અછત સર્જાઈ હતી. પ્રજાનું દુઃખ દૂર કરવા રાજા વીરસિંહે એક ભવ્ય અને ઊંડી વાવ બંધાવવાનું શરૂ કર્યું.",i:"Adalaj.jpg",c:"#1e1b4b"},
    {t:"પરંતુ વાવનું કામ હજુ અધૂરું હતું ત્યારે જ પડોશી રાજ્યના સુલતાન મહમૂદ બેગડાએ આક્રમણ કર્યું, અને આ યુદ્ધમાં રાજા વીરસિંહ વીરગતિ પામ્યા.",i:"Adalaj.jpg",c:"#1e1b4b"},
    {t:"રાણી રૂડાબાઈ સતી થવા તૈયાર થયા, પરંતુ મહમૂદ બેગડો તેમના રૂપ પર મોહિત થયો અને તેણે રાણી સામે લગ્નનો પ્રસ્તાવ મૂક્યો.",i:"Adalaj.jpg",c:"#1e1b4b"},
    {t:"ચતુર રાણી રૂડાબાઈએ શરત મૂકી કે જો સુલતાન પહેલા આ અધૂરી વાવનું બાંધકામ પૂર્ણ કરાવી દે, તો જ તે લગ્ન માટે વિચારશે.",i:"Adalaj.jpg",c:"#1e1b4b"},
    {t:"સુલતાને દિવસ-રાત કારીગરો લગાવીને પાંચ માળ ઊંડી અને અદભૂત નકશીકામવાળી વાવ તૈયાર કરાવી દીધી.",i:"Adalaj.jpg",c:"#1e1b4b"},
    {t:"વાવ પૂર્ણ થતાં જ રાણી રૂડાબાઈએ વાવની પ્રદક્ષિણા કરી, પ્રજાને પાણી અર્પણ કર્યું અને પોતાના પતિની યાદમાં એ જ વાવમાં કૂદીને પ્રાણ ત્યાગી દીધા. આજે પણ અડાલજની વાવ આ અમર બલિદાનની સાક્ષી પૂરે છે.",i:"Adalaj.jpg",c:"#1e1b4b"}
  ]
};

let idx = 0, playing = false, timer = null, speaking = false, totalSteps = 0, stepAudios = [];

function renderStory(st){
  totalSteps = st.s.length;
  const bgs = document.getElementById('bgs');
  const box = document.getElementById('box');
  bgs.innerHTML = '';
  box.innerHTML = '<div class="hero"><div><span class="badge">' + st.cat + '</span><h2 style="font-size:25px;margin-bottom:8px;font-weight:700">' + st.title + '</h2><p style="font-size:12px;color:#fde047;margin-bottom:8px;font-weight:600">📅 ' + (st.pubDate || '') + '</p><p style="color:#94a3b8;font-size:13px">નીચે સ્ક્રોલ કરો અથવા Play દબાવો ↓</p></div></div>';

  st.s.forEach(function(x,i){
    bgs.innerHTML += '<div id="b' + i + '" class="bg ' + (i===0?'active':'') + '" style="background-color:' + (x.c||'#1e1b4b') + ';background-image:url(\'' + x.i + '\')"></div>';
    box.innerHTML += '<div class="sec" id="sec-' + i + '" data-i="' + i + '"><div class="card" id="card-' + i + '">' + x.t + '</div></div>';
  });

  document.querySelectorAll('.sec').forEach(function(el){
    obs.observe(el);
  });
  updUI(0);
}

function updUI(i){
  idx = i;
  document.querySelectorAll('.bg').forEach(function(b, k){
    b.classList.toggle('active', k === i);
  });
  document.getElementById('pg').style.width = (((i + 1) / totalSteps) * 100) + '%';
  document.getElementById('cnt').innerText = (i + 1) + ' / ' + totalSteps;
}

const obs = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if(e.isIntersecting){
      e.target.classList.add('show');
      updUI(Number(e.target.dataset.i));
    }
  });
}, { threshold: 0.45 });

function togglePlay(){
  playing = !playing;
  const btn = document.getElementById('pbtn');
  if(playing){
    btn.innerText = '⏸ Pause';
    btn.classList.add('on');
    document.getElementById('bgm').play().catch(function(){});
    goStep(idx);
  } else {
    btn.innerText = '▶ Play';
    btn.classList.remove('on');
    clearTimeout(timer);
    stopAllVoice();
  }
}

function stopAllVoice(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  stepAudios.forEach(function(a){ if(a){ a.pause(); a.currentTime = 0; } });
  document.querySelectorAll('.card').forEach(function(c){ c.classList.remove('speaking'); });
}

function toggleVoice(){
  speaking = !speaking;
  const vb = document.getElementById('vbtn');
  if(speaking){
    vb.innerText = '🗣️ Voice: ON';
    vb.classList.add('on');
    if(playing){
      clearTimeout(timer);
      goStep(idx);
    } else {
      speakStep(idx, function(){});
    }
  } else {
    vb.innerText = '🗣️ Voice: OFF';
    vb.classList.remove('on');
    stopAllVoice();
  }
}

function speakStep(i, onDone){
  stopAllVoice();
  const card = document.getElementById('card-' + i);
  if(!card) return onDone();
  const txt = card.innerText.trim();
  card.classList.add('speaking');

  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'gu-IN';
    u.rate = 0.92;
    let finished = false;
    function done(){
      if(finished) return;
      finished = true;
      card.classList.remove('speaking');
      onDone();
    }
    u.onend = done;
    u.onerror = function(){ playCloudTTS(txt, card, done); };
    window.speechSynthesis.speak(u);
    setTimeout(function(){
      if(!window.speechSynthesis.speaking && !finished){
        playCloudTTS(txt, card, done);
      }
    }, 600);
  } else {
    playCloudTTS(txt, card, function(){
      card.classList.remove('speaking');
      onDone();
    });
  }
}

function playCloudTTS(txt, card, done){
  const parts = txt.match(/[^।.?!]+[।.?!]*/g) || [txt];
  let p = 0;
  function nextPart(){
    if(!speaking || p >= parts.length){
      card.classList.remove('speaking');
      return done();
    }
    const chunk = encodeURIComponent(parts[p].trim().slice(0, 180));
    p++;
    if(!chunk) return nextPart();
    const url = 'https://google.com' + chunk;
    const au = new Audio(url);
    stepAudios.push(au);
    au.onended = nextPart;
    au.onerror = nextPart;
    au.play().catch(nextPart);
  }
  nextPart();
}

function goStep(i){
  if(!playing) return;
  if(i >= totalSteps){
    playing = false;
    document.getElementById('pbtn').innerText = '▶ Replay';
    document.getElementById('pbtn').classList.remove('on');
    stopAllVoice();
    return;
  }
  const el = document.getElementById('sec-' + i);
  if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updUI(i);

  if(speaking){
    speakStep(i, function(){
      if(playing){
        timer = setTimeout(function(){ goStep(i + 1); }, 800);
      }
    });
  } else {
    const spd = Number(document.getElementById('spd').value);
    timer = setTimeout(function(){ goStep(i + 1); }, spd);
  }
}

function shareWA(){
  window.open('https://whatsapp.com' + encodeURIComponent(document.title + ' - વાંચો અને સાંભળો: ' + location.href));
}

const sid = new URLSearchParams(location.search).get('id');
if(!sid || sid === "adalaj-ni-vav"){
  renderStory(fallback);
} else {
  fetch(sid + ".json?t=" + Date.now()).then(function(r){
    if(!r.ok) throw new Error("Not separate");
    return r.json();
  }).then(function(found){
    const dtStr = (found.id && found.id.startsWith('st-')) ? new Date(Number(found.id.replace('st-',''))).toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '25 Nov 2026';
    renderStory({ cat: found.categoryName, title: found.title, pubDate: dtStr, s: found.s });
  }).catch(function(){
    fetch("stories.json?t=" + Date.now()).then(function(r){ return r.json(); }).then(function(cloud){
      const found = Array.isArray(cloud) ? cloud.find(function(x){ return x.id === sid; }) : null;
      if(found){
        const dtStr = (found.id && found.id.startsWith('st-')) ? new Date(Number(found.id.replace('st-',''))).toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '25 Nov 2026';
        renderStory({ cat: found.categoryName, title: found.title, pubDate: dtStr, s: found.s });
      } else {
        renderStory(fallback);
      }
    }).catch(function(){ renderStory(fallback); });
  });
}
</script>
</body>
</html>
