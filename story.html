<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>સમયચક્ર - સ્ટોરી</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans Gujarati',sans-serif;background:#090d16;color:#fff}
  .bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s ease-in-out;z-index:1}
  .bg.active{opacity:1}
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:2}
  .top{position:fixed;top:0;left:0;right:0;background:rgba(10,15,28,.85);backdrop-filter:blur(6px);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;z-index:999}
  .top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;font-size:14px}
  main{position:relative;z-index:10;padding:80px 18px 140px}
  .sec{min-height:18vh;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .card{
    background:transparent;padding:12px 16px;max-width:650px;width:100%;
    font-size:20px;font-weight:600;line-height:1.85;color:#ffffff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.95), 0 0 18px rgba(0,0,0,0.9);
    transition: transform 0.3s, color 0.3s;
  }
  .card.speaking{color:#fde047;transform:scale(1.02)}
  .bar{position:fixed;bottom:16px;left:0;right:0;margin:auto;width:fit-content;background:rgba(15,23,42,.95);backdrop-filter:blur(8px);padding:8px 12px;border-radius:40px;display:flex;gap:6px;align-items:center;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.85);flex-wrap:wrap;justify-content:center}
  #pbtn{background:#ef4444;color:#fff;border:0;padding:7px 14px;border-radius:25px;font-weight:700;cursor:pointer;font-size:13px}
  #vbtn,#mbtn{background:#1e293b;color:#38bdf8;border:0;padding:7px 11px;border-radius:25px;font-weight:700;cursor:pointer;font-size:12px}
  #vbtn.on{background:#10b981;color:#fff}
  .sbtn{background:transparent;color:#cbd5e1;border:0;padding:5px 8px;border-radius:15px;cursor:pointer;font-size:11px}
  .sbtn.on{background:#475569;color:#fff}
</style>
</head>
<body>
<div class="top"><a href="index.html">← પાછા જાઓ</a><span id="cat" style="color:#f87171;font-weight:700"></span></div>
<div id="bgs"></div><div class="shade"></div>
<main id="box"><div class="sec"><div class="card" style="text-align:center">સ્ટોરી લોડ થઈ રહી છે...</div></div></main>

<div class="bar">
  <button id="pbtn" onclick="tog()">▶ Play</button>
  <button id="vbtn" onclick="togVoice()">🔇 Voice</button>
  <button id="mbtn" onclick="togMusic()">🔇 Music</button>
  <button class="sbtn on" onclick="spd(0.6,this)">Slow</button>
  <button class="sbtn" onclick="spd(1.2,this)">Med</button>
  <button class="sbtn" onclick="spd(2.2,this)">Fast</button>
</div>

<script>
const fallback = {
  cat:"ઇતિહાસ",title:"અડાલજની વાવ: પથ્થરોમાં કોતરાયેલી અમર પ્રેમ અને બલિદાનની ગાથા",s:[
    {t:"૧૫મી સદીમાં ગુજરાતના અડાલજ ગામમાં રાજા વીરસિંહ વાઘેલાનું શાસન હતું. પ્રજાની પાણીની તકલીફ દૂર કરવા રાજાએ એક ભવ્ય વાવ બનાવવાનું કામ શરૂ કર્યું.",i:"Adalaj.jpg",c:"#2e1065"},
    {t:"વાવનું કામ અધૂરું હતું ત્યારે પડોશી શાસક મહમૂદ બેગડાએ આક્રમણ કર્યું. આ યુદ્ધમાં રાજા વીરસિંહ વીરગતિ પામ્યા.",i:"Adalaj.jpg",c:"#172554"},
    {t:"રાણી રૂડાબાઈએ શરત મૂકી કે જો બેગડો અધૂરી વાવ પૂર્ણ કરાવશે, તો જ તે લગ્ન કરશે.",i:"Adalaj.jpg",c:"#064e3b"},
    {t:"વાવ તૈયાર થતાં જ રાણી રૂડાબાઈએ વાવની પ્રદક્ષિણા કરી અને પવિત્ર જળમાં સમાધિ લઈ પોતાનો પતિધર્મ નિભાવ્યો.",i:"Adalaj.jpg",c:"#7f1d1d"}
  ]
};

let activeStory = fallback;

function renderStory(st){
  activeStory = st;
  document.title = st.title + " - સમયચક્ર";
  document.getElementById('cat').innerText = st.cat;
  const bgs=document.getElementById('bgs'),box=document.getElementById('box');
  bgs.innerHTML = '';
  box.innerHTML = '<div class="sec" style="min-height:28vh"><div class="card" style="text-align:center"><h2 style="font-size:25px;margin-bottom:8px;font-weight:700">' + st.title + '</h2><p style="font-size:14px;color:#e2e8f0">નીચે સ્ક્રોલ કરો અથવા Play દબાવો ↓</p></div></div>';
  st.s.forEach(function(x,i){
    bgs.innerHTML += '<div id="b' + i + '" class="bg ' + (i===0?'active':'') + '" style="background-color:' + (x.c||'#1e1b4b') + ';background-image:url(\'' + x.i + '\')"></div>';
    box.innerHTML += '<div class="sec" id="sec-' + i + '" data-i="' + i + '"><div class="card" id="card-' + i + '">' + x.t + '</div></div>';
  });
  const ob=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting && e.target.dataset.i !== undefined){
        document.querySelectorAll('.bg').forEach(function(b){ b.classList.remove('active'); });
        const el = document.getElementById('b' + e.target.dataset.i);
        if(el) el.classList.add('active');
      }
    });
  },{rootMargin:"-35% 0px -35% 0px"});
  document.querySelectorAll('.sec').forEach(function(s){ ob.observe(s); });
}

// Ambient Music
let audioCtx=null, musicTimer=null, musicOn=false;
const notes=[261.63, 329.63, 392.00, 493.88, 392.00, 329.63];
let noteIdx=0;
function playSoftNote(){
  if(!musicOn) return;
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.value = notes[noteIdx++ % notes.length];
  gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.035, audioCtx.currentTime + 0.5);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.8);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 3);
}
function togMusic(){
  musicOn = !musicOn;
  const mb = document.getElementById('mbtn');
  if(musicOn){ mb.innerText = '🔊 Music'; playSoftNote(); musicTimer = setInterval(playSoftNote, 2400); }
  else { mb.innerText = '🔇 Music'; clearInterval(musicTimer); }
}

// Clean & Instant Stop Voiceover Logic
let voiceOn = false, voiceIdx = 0, voiceWatcher = null, currentUtter = null;

function getBestVoice(){
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang.includes('gu')) ||
         voices.find(v => v.lang.includes('hi')) ||
         voices.find(v => v.lang.includes('en-IN')) || null;
}
if('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = getBestVoice;

function stopVoiceCompletely(){
  voiceOn = false;
  clearInterval(voiceWatcher);
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  currentUtter = null;
  const vb = document.getElementById('vbtn');
  vb.innerText = '🔇 Voice';
  vb.classList.remove('on');
  document.querySelectorAll('.card').forEach(function(c){ c.classList.remove('speaking'); });
}

function speakStep(idx){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  clearInterval(voiceWatcher);
  window.speechSynthesis.cancel();
  document.querySelectorAll('.card').forEach(function(c){ c.classList.remove('speaking'); });

  if(idx >= activeStory.s.length){
    stopVoiceCompletely();
    if(on) tog();
    return;
  }

  voiceIdx = idx;
  const secEl = document.getElementById('sec-' + idx);
  const cardEl = document.getElementById('card-' + idx);
  if(secEl) secEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if(cardEl) cardEl.classList.add('speaking');

  currentUtter = new SpeechSynthesisUtterance(activeStory.s.at(idx).t);
  const chosenVoice = getBestVoice();
  if(chosenVoice) currentUtter.voice = chosenVoice;
  currentUtter.lang = chosenVoice ? chosenVoice.lang : 'gu-IN';
  currentUtter.rate = 0.92;

  let started = false;
  currentUtter.onstart = function(){ started = true; };
  window.speechSynthesis.speak(currentUtter);

  // Safe watcher: checks every 400ms if speech finished without error loop
  let waitCount = 0;
  voiceWatcher = setInterval(function(){
    if(!voiceOn){ clearInterval(voiceWatcher); return; }
    waitCount++;
    if(started && !window.speechSynthesis.speaking){
      clearInterval(voiceWatcher);
      speakStep(idx + 1);
    } else if(!started && waitCount > 6){
      // Browser does not support speech: stop voice cleanly & let normal scroll continue
      clearInterval(voiceWatcher);
      stopVoiceCompletely();
    }
  }, 400);
}

function togVoice(){
  if(voiceOn){
    stopVoiceCompletely();
  } else {
    voiceOn = true;
    const vb = document.getElementById('vbtn');
    vb.innerText = '🗣️ Voice ON';
    vb.classList.add('on');
    speakStep(voiceIdx);
  }
}

// Auto-Scroll Logic
let on=false,sp=0.6,tm;
function run(){
  if(!on)return;
  if(!voiceOn) window.scrollBy(0,sp);
  if(innerHeight+scrollY>=document.body.offsetHeight-2 && !voiceOn){tog();return;}
  tm=requestAnimationFrame(run);
}
function tog(){
  on=!on;
  document.getElementById('pbtn').innerText=on?'⏸ Pause':'▶ Play';
  if(on){
    if(!musicOn) togMusic();
    run();
  } else {
    cancelAnimationFrame(tm);
    stopVoiceCompletely();
    if(musicOn) togMusic();
  }
}
function spd(v,b){sp=v;document.querySelectorAll('.sbtn').forEach(function(x){ x.classList.remove('on'); });b.classList.add('on');}

window.onbeforeunload = function(){ stopVoiceCompletely(); };

const sid = new URLSearchParams(location.search).get('id');
if(!sid || sid === "adalaj-ni-vav"){
  renderStory(fallback);
} else {
  fetch("stories.json?t=" + Date.now()).then(function(r){ return r.json(); }).then(function(cloud){
    const found = Array.isArray(cloud) ? cloud.find(function(x){ return x.id === sid; }) : null;
    if(found){
      renderStory({ cat: found.categoryName, title: found.title, s: found.s });
    } else {
      renderStory(fallback);
    }
  }).catch(function(){ renderStory(fallback); });
}
</script>
</body>
</html>
